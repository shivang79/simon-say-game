<!DOCTYPE html>
<html>
  <head>
    <title>SIMON SAY GAME!</title>
    <link rel="stylesheet" href="style.css" />

  <body>
      <h1>SIMONS SAY GAME HULULULU!</h1>
      <h2>PRESS ANY KEY TO START THE GAME!</h2>

          <div class='two yellow' id='yellow' type="button">
            1
          </div>

          </div>

            4
          </div>
        </div>
      </div>
      <script src="app.js"></script>
  </body>
</html>
